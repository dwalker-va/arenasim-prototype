<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gauntlet Prototype</title>
<!--
  AS-255: a click-through of Gauntlet runs from
  docs/design/proposals/2026-10-11-talents-and-gauntlet.md.

  Everything here is MOCK. The "fight" is a scripted stand-in for PlayMatch, not
  the sim: its outcome is a coin flip weighted by the two sides' budgets
  (starting kit + talents + gear) and the answers your Prepare settings give.

  What follows the proposal:
  - the caps: 2 talent points at the draft, +1 after every match up to 8, and one
    reward pick per combatant per match up to 6 (section 7.2);
  - the Warlock and Priest mock trees (section 5), tier gates 0/2/3/5;
  - the Gauntlet (ilvl 78) and Champion (ilvl 92) tiers, Champion offers only
    after a win at 1/3, and the Champion trinkets (section 6);
  - opponents scaling with wins to budget parity, and the six difficulty levels
    (sections 7.3 and 8);
  - renown abilities awarded when their condition is met (section 9): a small
    condition vocabulary evaluated at match end (from a mocked match-facts
    digest) and at run end (from the run record), and the encyclopedia's Renown
    section showing each ability's effect, condition and state. The profile is
    kept in this browser's localStorage; the menu has prototype-only buttons to
    record a clear or reset it.
  The draft pool is the slice's four classes. The Rogue and Paladin trees are not
  designed yet, so their points become item budget, as for opponents without a tree.

  Icons: class and ability art is read from the checkout by relative path (open
  this file from docs/design/benches/ inside the repo); art the repo does not ship
  falls back to Wowhead's icon CDN, then to initials.

  The look is deliberately neutral: the screens' visual language belongs to the
  UI design system (AS-251). Judge the FLOW and the decisions, not the styling.
-->
<style>
:root{
  color-scheme: dark;
  --bg:#13110e; --panel:#1d1a15; --panel2:#27231c; --line:#3c342a;
  --text:#ece5d8; --muted:#a39886; --gold:#e6b450; --win:#7fbf6a; --loss:#d0614f;
  --t1:#4f8fe0; --t2:#d8534a;
  --sans: Georgia, "Times New Roman", serif;
  --ui: system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:14px;line-height:1.4}
body{padding:16px}
.wrap{max-width:1040px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
header.top h1{font-family:var(--sans);font-size:20px;margin:0;color:var(--gold);letter-spacing:.02em}
.note{color:var(--muted);font-size:12px;max-width:70ch}
h2{font-family:var(--sans);font-size:22px;margin:0 0 4px;color:var(--gold)}
h3{font-family:var(--sans);font-size:16px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
button{font:inherit;cursor:pointer}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 16px;border-radius:6px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:#3a2c12;border-color:var(--gold);color:var(--gold);font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.card:focus-visible,.node:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:16px}
.card{background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:12px;text-align:left;color:var(--text);display:flex;flex-direction:column;gap:6px;min-width:0}
.card:hover{border-color:#6a5a40}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.title{font-weight:600;font-size:15px}
.meta{color:var(--muted);font-size:12px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.tag.heal{color:var(--win);border-color:#3f6334}
.tag.pts{color:var(--gold);border-color:var(--gold)}
.ico{width:40px;height:40px;border-radius:5px;border:1px solid #000;object-fit:cover;flex:none;background:#333;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#111;font-size:12px}
.ico.sm{width:24px;height:24px;border-radius:3px;font-size:9px}
.ico.lg{width:56px;height:56px}
.hstack{display:flex;align-items:center;gap:10px;min-width:0}
.pips{display:flex;gap:4px;align-items:center}
.pip{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);background:#0c0b09}
.pip.w{background:var(--win);border-color:var(--win)}
.pip.l{background:var(--loss);border-color:var(--loss)}
.record{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:13px}
.threat{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--line)}
.threat:first-of-type{border-top:0}
.answer{color:var(--win)}
.missing{color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:6px;font:inherit;font-size:13px}
.frames{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.frame{display:flex;align-items:center;gap:8px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);margin-bottom:6px;width:100%;color:var(--text);text-align:left}
.frame.enemy:hover{border-color:var(--t2)}
.frame.called{border-color:var(--t2);box-shadow:0 0 0 1px var(--t2) inset}
.bar{flex:1;height:12px;background:#0c0b09;border-radius:3px;overflow:hidden;min-width:40px}
.bar>i{display:block;height:100%;background:var(--win);transition:width .25s}
.log{height:170px;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);background:#0c0b09;border:1px solid var(--line);border-radius:6px;padding:8px}
.log b{color:var(--text);font-weight:500}
.big{font-family:var(--sans);font-size:34px;margin:4px 0}
.win{color:var(--win)} .loss{color:var(--loss)}
.delta{font-size:12px}
.delta .up{color:var(--win)} .delta .dn{color:var(--loss)}
.matchlist .m{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;padding:6px 0;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);padding:10px 14px;border-radius:6px;max-width:calc(100% - 32px);font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;display:none}
.menu{display:flex;flex-direction:column;gap:10px;align-items:center;padding:40px 0}
.menu .btn{width:280px;padding:14px;font-size:16px}
/* talent trees */
.trees{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tree{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0}
.tree h4{margin:0 0 6px;font-family:var(--sans);font-size:14px;display:flex;justify-content:space-between;gap:6px}
.tier{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:6px;position:relative}
.tier .gate{position:absolute;right:0;top:-2px;font-size:10px;color:var(--muted)}
.node{position:relative;background:#16130f;border:1px solid var(--line);border-radius:6px;padding:4px;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;text-align:center;font-size:11px;line-height:1.2}
.node .nm{overflow:hidden;text-overflow:ellipsis;width:100%;white-space:nowrap}
.node .rk{font-size:10px;color:var(--muted)}
.node.avail{border-color:#6f8f3a}
.node.avail .rk{color:var(--win)}
.node.has{border-color:var(--gold)}
.node.has .rk{color:var(--gold)}
.node.pending{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:#2a2112}
.node.locked{opacity:.45}
.node.cap{border-style:double;border-width:3px}
.node .req{font-size:9px;color:var(--muted)}
.detail{margin-top:10px;min-height:54px}
.spec{font-size:12px;color:var(--gold)}
.kind{font-size:10px;padding:0 4px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
@media (max-width:760px){.trees{grid-template-columns:1fr}}
@media (max-width:620px){.frames{grid-template-columns:1fr}}
</style>
</head>

// Reference builds (spend order) that authored opponents are cut from.
const REF = {

for(const cls in TREES) for(const tree in TREES[cls]) for(const n of TREES[cls][tree]) NODE[n[0]] = {id:n[0],name:n[1],tier:n[2],col:n[3],max:n[4],req:n[5],icon:n[6],kind:n[7],text:n[8],threat:n[9],tree,cls};

// ---- Gear (proposal section 6) -----------------------------------------------

const SLOT_MULT = {Head:1.0, Chest:1.0, Legs:0.875, Shoulders:0.75, Hands:0.75, Feet:0.75, Weapon:1.0, Trinket:0.5625};

function slotBudget(slot,lvl){return lvl*0.75*SLOT_MULT[slot]}

function currentIlvl(c,slot){const g=c.gear[slot];return g?g.ilvl:ILVL.start}
function makeOffer(c,slot,tier){
  const lvl = ILVL[tier], gain = slotBudget(slot,lvl)-slotBudget(slot,currentIlvl(c,slot));
  const [st,gset,cset] = ARMOR[c.cls];
  if(tier==="champion" && slot==="Trinket"){
    const ok = CHAMPION_TRINKETS.filter(t=>(t[3]==="any"||t[3]===st) && !Object.values(c.gear).some(g=>g.name===t[0]));
    const t = ok[Math.floor(rng()*ok.length)];
    return {cls:c.cls, slot, tier, ilvl:lvl, gain, name:t[0], icon:t[1], effect:t[2], threat:t[4], stats:statLine(c.cls,slotBudget(slot,lvl))};
  }
  return {cls:c.cls, slot, tier, ilvl:lvl, gain, name:`${tier==="champion"?cset:gset} ${SLOT_WORD[slot]}`, icon:SLOT_ICON[slot], effect:null, threat:null, stats:statLine(c.cls,slotBudget(slot,lvl))};
}
// Offers for one combatant: Gauntlet gear, plus one Champion offer after a win with the run's chance.
function offersFor(c,won){
  const n = equipmentChoices();
  const out = [];
  const gauntletSlots = FELT_SLOTS.filter(s=>currentIlvl(c,s)<ILVL.gauntlet);
  const st = ARMOR[c.cls][0];
  const trinketsLeft = CHAMPION_TRINKETS.some(t=>(t[3]==="any"||t[3]===st) && !hasItem(c,t[0]));
  const champSlots = FELT_SLOTS.filter(s=>currentIlvl(c,s)<ILVL.champion && (s!=="Trinket"||trinketsLeft));
  if(won && rng() < championChance() && champSlots.length){
    const slot = rng()<0.5 && champSlots.includes("Trinket") ? "Trinket" : champSlots[Math.floor(rng()*champSlots.length)];
    out.push(makeOffer(c,slot,"champion"));
  }
  for(const s of pick(gauntletSlots.filter(s=>!out.some(o=>o.slot===s)), n-out.length)) out.push(makeOffer(c,s,"gauntlet"));
  return out;
}
function gearGain(c){return Object.values(c.gear).reduce((s,g)=>s+g.gainTotal,0)}
function talentPrice(c){let s=0;for(const id in c.ranks)s+=c.ranks[id]*(NODE[id].tier===4?22:11);return s}
function budget(c){return KIT_BUDGET + talentPrice(c) + gearGain(c) + (c.gearPts||0)*11}

// ---- Caps, difficulty and the profile (sections 7.2, 8, 9) -----------------------
const POINT_CAP = 8, PICK_CAP = 6, START_POINTS = 2;
function pointCap(){return POINT_CAP}
function pickCap(){return PICK_CAP}
function championChance(){return 1/3}
const LEVELS = [ // [name, extra picks, extra Champion items (99 = all), opponent points rule]
  ["Novice",-2,-99,"parity"],["Combatant",0,0,"parity"],["Challenger",1,1,"parity"],
  ["Rival",2,2,"parity"],["Duelist",3,99,"plus1"],["Gladiator",4,99,"full"],
];
// ---- Renown (section 9): abilities AWARDED when their condition is met ------------
// A condition is a scope plus a list of leaves that must all hold. A leaf is one
// entry in LEAVES: a predicate over the facts its scope reads, and a prose line.
// A new renown ability is one RENOWN entry; a new leaf is one LEAVES entry.
const LEAVES = {
  // Run scope: reads the run record.
  Cleared:{scope:"run", test:(r,lvl)=>r.cleared && r.level>=lvl, text:lvl=>`clear a Gauntlet run at ${LEVELS[lvl][0]} or above`},
  LossesAtMost:{scope:"run", test:(r,n)=>r.losses<=n, text:n=>n===0?"without a loss":`with at most ${n} losses`},
  TeamIncludes:{scope:"run", test:(r,cls)=>r.team.includes(cls), text:cls=>`with a ${cls} on your team`},
  HealerCount:{scope:"run", test:(r,n)=>r.team.filter(c=>CLASSES[c].heal).length===n, text:n=>n===0?"with no healer on your team":`with exactly ${n} healer`},
  NoItemTierEquipped:{scope:"run", test:(r,tier)=>!r.tiersEquipped.includes(tier), text:()=>"without ever equipping a Champion item"},
  // Match scope: reads the match-facts digest (mocked here; built from the match result and combat log in the game).
  Won:{scope:"match", test:f=>f.won, text:()=>"win a Gauntlet match"},
  CameDownToOneVsOne:{scope:"match", test:f=>f.oneVsOne, text:()=>"that comes down to a 1v1"},
  KillingBlowWhileOffTargetInHardCc:{scope:"match", test:f=>f.cleanKill, text:()=>"landing the killing blow while the other enemy is in hard crowd control"},
  // Profile scope: reads the history of clears.
  DistinctClassesCleared:{scope:"profile", test:(p,n)=>new Set(p.history.flatMap(h=>h.team)).size>=n, text:n=>`clear Gauntlet runs with ${n} different classes`, progress:(p,n)=>[new Set(p.history.flatMap(h=>h.team)).size,n]},
};
const EFFECTS = {
  draft:{text:n=>`+${n} draft choice`, ceiling:6, base:3},
  offers:{text:n=>`+${n} equipment choice`, ceiling:5, base:3},
  rerolls:{text:n=>`+${n} equipment reroll a run`, ceiling:5, base:0},
  title:{text:t=>`the title "${t}"`},
};
const RENOWN = [ // [id, name, kind, {effect}, scope, [[leaf, arg]...]]
  ["ArenaCombatant","Arena Combatant","Flagship",{draft:1},"run",[["Cleared",1]]],
  ["ArenaChallenger","Arena Challenger","Flagship",{offers:1},"run",[["Cleared",2]]],
  ["ArenaRival","Arena Rival","Flagship",{draft:1},"run",[["Cleared",3]]],
  ["ArenaDuelist","Arena Duelist","Flagship",{offers:1},"run",[["Cleared",4]]],
  ["ArenaGladiator","Arena Gladiator","Flagship",{draft:1},"run",[["Cleared",5]]],
  ["CloakAndDagger","Cloak and Dagger","Objective",{rerolls:1},"run",[["Cleared",1],["TeamIncludes","Rogue"]]],
  ["AllOffense","All Offense","Objective",{rerolls:1},"run",[["Cleared",1],["HealerCount",0]]],
  ["Flawless","Flawless","Objective",{rerolls:1,title:"the Flawless"},"run",[["Cleared",1],["LossesAtMost",0]]],
  ["OpenHanded","Open-Handed","Objective",{rerolls:1},"run",[["Cleared",1],["NoItemTierEquipped","champion"]]],
  ["LastOneStanding","Last One Standing","Objective",{rerolls:1},"match",[["Won"],["CameDownToOneVsOne"]]],
  ["CleanKill","Clean Kill","Objective",{title:"the Precise"},"match",[["Won"],["KillingBlowWhileOffTargetInHardCc"]]],
  ["Versatile","Versatile","Objective",{title:"the Versatile"},"profile",[["DistinctClassesCleared",4]]],
];
// No condition may reward a double-healer team (section 9.2): checked at load, like the game's validator.
for(const r of RENOWN){
  for(const [leaf,arg] of r[5]){ if(!LEAVES[leaf]||LEAVES[leaf].scope!==r[4]) throw new Error(`renown ${r[0]}: leaf ${leaf} is not a ${r[4]} leaf`); if(leaf==="HealerCount"&&arg>1) throw new Error(`renown ${r[0]} rewards a double-healer team`) }
}
function conditionText(r){const t=r[5].map(([leaf,arg])=>LEAVES[leaf].text(arg));return t[0].charAt(0).toUpperCase()+t[0].slice(1)+(t.length>1?" "+t.slice(1).join(", "):"")+"."}
function effectText(e){return Object.entries(e).map(([k,v])=>EFFECTS[k].text(v)).join("; ")}
function freshProfile(){return {clears:[0,0,0,0,0,0], unlocked:{}, history:[], runs:0}}
let P = freshProfile();
try{ const raw = localStorage.getItem("arenasim-gauntlet-profile"); if(raw) P = Object.assign(freshProfile(), JSON.parse(raw)); }catch(e){}
for(const id in P.unlocked) if(!RENOWN.some(r=>r[0]===id)) delete P.unlocked[id];   // a removed ability is dropped on load
function saveProfile(){try{localStorage.setItem("arenasim-gauntlet-profile",JSON.stringify(P))}catch(e){}}
function unlocked(id){return !!P.unlocked[id]}
function effectTotal(k){return RENOWN.filter(r=>unlocked(r[0])&&r[3][k]).reduce((s,r)=>s+r[3][k],0)}
function draftSlots(){return Math.min(EFFECTS.draft.ceiling, EFFECTS.draft.base+effectTotal("draft"))}
function equipmentChoices(){return Math.min(EFFECTS.offers.ceiling, EFFECTS.offers.base+effectTotal("offers"))}
function rerollsPerRun(){return Math.min(EFFECTS.rerolls.ceiling, effectTotal("rerolls"))}
function levelUnlocked(i){return i<=1 || P.clears[i-1]>0}
// evaluate(scope, facts): award every ability of that scope whose condition now holds. Idempotent.
function evaluate(scope, facts, where){
  const got=[];
  for(const r of RENOWN){
    if(r[4]!==scope || unlocked(r[0])) continue;
    if(r[5].every(([leaf,arg])=>LEAVES[leaf].test(facts,arg))){ P.unlocked[r[0]]=where; got.push(r[0]); }
  }
  saveProfile();
  return got;
}
// Run end: record the clear, then the run and profile conditions. Awards take effect from the next run.
function endOfRun(record){
  P.runs++;
  const got=[];
  if(record.cleared){ P.clears[record.level]++; P.history.push({team:record.team, level:record.level}); }
  got.push(...evaluate("run", record, `run ${P.runs}`));
  got.push(...evaluate("profile", P, `run ${P.runs}`));
  saveProfile();
  return {awards:got, unlockedLevel: record.cleared && record.level+1<LEVELS.length && P.clears[record.level]===1 ? LEVELS[record.level+1][0] : null};
}

const MAX_WINS = 7, MAX_LOSSES = 3;
const MAPS = ["Basic Arena","Nagrand Arena","Twin Pillars"];
// The authored ladder: one or two opponents per tier (index = tier-1); the AI profile is per opponent.
const LADDER = [
  [["Gate Rats",["Warrior","Priest"],"Legacy"]],
  [["The Dustcloaks",["Rogue","Druid"],"Legacy"]],
  [["Ashen Pair",["Mage","Shaman"],"Legacy"],["Cinder Pact",["Mage","Priest"],"Legacy"]],
  [["Thornwatch",["Warlock","Priest"],"TeamPlan"]],
  [["Stormhold Duo",["Hunter","Paladin"],"Legacy"],["Greycloaks",["Hunter","Priest"],"TeamPlan"]],
  [["The Gilded Fangs",["Rogue","Priest"],"Legacy"]],
  [["Champions of the Ring",["Warrior","Paladin"],"Legacy"]],
];

// ---- Seeded RNG: offers and opponents come from the run seed -----------------------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rng = Math.random;
function pick(arr,n){const a=arr.slice(),out=[];while(out.length<n&&a.length){out.push(a.splice(Math.floor(rng()*a.length),1)[0])}return out}

// ---- Talent rules -------------------------------------------------------------
function hasTree(cls){return !!TREES[cls]}
function rankOf(c,id){return (c.ranks[id]||0)+(c.pending.filter(p=>p===id).length)}
function pointsInTree(c,tree){let s=0;for(const id in NODE){if(NODE[id].cls===c.cls&&NODE[id].tree===tree)s+=rankOf(c,id)}return s}
function spentTotal(c){return Object.values(c.ranks).reduce((a,b)=>a+b,0)}
function earnedTotal(c){return spentTotal(c)+c.unspent+(c.gearPts||0)}
function available(c){return c.unspent - c.pending.length}
// Why a node cannot take a point now, or null if it can.
function blocker(c,id){
  const n=NODE[id];
  if(rankOf(c,id)>=n.max) return "Max rank";
  if(available(c)<=0) return "No unspent points";
  const inTree=pointsInTree(c,n.tree);
  if(inTree<GATE[n.tier]) return `Needs ${GATE[n.tier]} points in ${n.tree} (has ${inTree})`;
  if(n.req && rankOf(c,n.req[0])<n.req[1]) return `Needs ${NODE[n.req[0]].name} ${n.req[1]}/${NODE[n.req[0]].max}`;
  return null;
}
function knows(c,id){return (c.ranks[id]||0)>0}
function spec(c){
  if(!hasTree(c.cls)) return {label:(c.gearPts||0)?`${c.gearPts} pts as gear`:"",short:""};
  const trees=Object.keys(TREES[c.cls]);
  const pts=trees.map(t=>{let s=0;for(const id in c.ranks)if(NODE[id].tree===t)s+=c.ranks[id];return s});
  const total=pts.reduce((a,b)=>a+b,0);
  if(!total) return {label:"No talents yet",short:"0/0/0"};
  const sorted=pts.slice().sort((a,b)=>b-a);
  const top=trees[pts.indexOf(sorted[0])];
  const hybrid = sorted[0]===sorted[1];
  return {label:hybrid?`${trees[pts.indexOf(sorted[0])]}-${trees[pts.lastIndexOf(sorted[1])]} hybrid`:`${top} ${c.cls}`,short:pts.join("/")};
}
function actingNodes(c){return Object.keys(c.ranks).filter(id=>c.ranks[id]>0&&["Grant","Proc","Mechanic","Widens choice"].includes(NODE[id].kind))}
function optionsFor(c,ch){return ch.opts.filter(o=>!o[1]||knows(c,o[1])).map(o=>o[0])}
function hasItem(c,name){return Object.values(c.gear).some(g=>g.name===name)}

// ---- State ------------------------------------------------------------------
let S = null, saved = null;
function newRun(seed, level){
  seed = seed ?? Math.floor(Math.random()*1e9);
  rng = mulberry32(seed);
  const offer = pick(SLICE_POOL, Math.min(draftSlots(), SLICE_POOL.length));
  S = {seed, level: level ?? 1, offer, draft:[], team:[], wins:0, losses:0, history:[], prep:{kill:1,cc:0}, screen:"draft", sel:{}, offers:null, opp:null, lastWon:false, rerolls:rerollsPerRun(), runEnd:null, newAwards:[], tiersEquipped:[]};
  render();
}
function matchNo(){return S.wins+S.losses+1}
function oppPoints(t){const rule=LEVELS[S.level][3];if(rule==="full")return 8;return Math.min(t+1+(rule==="plus1"?1:0),8)}
function oppGear(t){
  const lv=LEVELS[S.level];
  const picks=Math.max(0,t-1+lv[1]);
  const champs=Math.max(0,Math.min(picks, lv[2]>=99?picks:Math.floor((t-1)/3)+lv[2]));
  return {picks,champs};
}
function opponentAt(tier, lostHere){
  const choices = LADDER[tier-1];
  const [name,classes,ai] = choices[Math.min(lostHere, choices.length-1)];
  const pts = oppPoints(tier), g = oppGear(tier);
  const builds = classes.map((cls,i)=>{
    const c={cls,ranks:{},pending:[],unspent:0,gear:{},gearPts:hasTree(cls)?0:pts};
    if(REF[cls]) for(const id of REF[cls].slice(0,pts)) c.ranks[id]=(c.ranks[id]||0)+1;
    // Their first Champion item is a trinket: the gear a briefing can name.
    if(g.champs>0){const st=ARMOR[cls][0];const t=CHAMPION_TRINKETS.filter(x=>x[3]==="any"||x[3]===st)[(tier+i)%2];c.gear.Trinket={name:t[0],icon:t[1],effect:t[2],threat:t[4],tier:"champion",ilvl:ILVL.champion,gainTotal:0}}
    c.oppGearBudget = g.picks*12 + g.champs*10;
    return c;
  });
  return {tier, name, classes, builds, pts, picks:g.picks, champs:g.champs, ai, map:MAPS[(tier+lostHere)%3]};
}
function opponent(){
  if(S.opp && S.opp.match===matchNo()) return S.opp;
  const tier = Math.min(S.wins, 6)+1;
  const lostHere = S.history.filter(h=>h.tier===tier&&!h.won).length;
  S.opp = Object.assign(opponentAt(tier,lostHere), {match:matchNo()});
  return S.opp;
}
function prepFor(c,key){const ch=(CHOICES[c.cls]||[]).find(x=>x.key===key);const opts=optionsFor(c,ch);const v=S.prep[c.cls+"."+key];return opts.includes(v)?v:opts[0]}
function answersFor(opp){
  const out=[], miss=[];
  const mine=cls=>S.team.find(t=>t.cls===cls);
  const theirs=cls=>opp.classes.includes(cls);
  const melee=opp.classes.filter(c=>MELEE.includes(c)).length;
  const casters=opp.classes.filter(c=>["Mage","Priest","Warlock","Shaman","Druid","Paladin"].includes(c));
  const wl=mine("Warlock");
  if(wl){
    const demon=prepFor(wl,"demon"), curse=prepFor(wl,"curse");
    if(demon==="Felhunter"){
      if(theirs("Mage")) out.push("The Felhunter can devour Polymorph off your healer");
      if(casters.length) out.push(`Spell Lock answers their ${casters[0]}'s casts`);
      if(knows(wl,"SoulLink")) out.push("Soul Link: the Felhunter soaks 12% of the damage on your Warlock");
    } else {
      out.push("Sacrifice: +15% Shadow damage, and no Felhunter for them to kill");
      if(knows(wl,"SoulLink")) miss.push("Soul Link is off while the Felhunter is sacrificed");
    }
    if(curse==="Curse of Tongues"&&casters.length) out.push("Curse of Tongues slows their healer's casts");
    if(curse==="Curse of Weakness"&&melee) out.push("Curse of Weakness blunts their melee");
    if(curse==="Curse of Exhaustion"&&(theirs("Hunter")||theirs("Mage"))) out.push("Curse of Exhaustion pins their kiter down");
    if(curse==="Curse of Agony"&&knows(wl,"ImprovedCurseOfAgony")) out.push("Improved Curse of Agony: your Agony ticks harder");
    if((theirs("Hunter")||theirs("Mage"))&&!knows(wl,"CurseOfExhaustion")) miss.push("No slow for their kiter: Curse of Exhaustion is an Affliction talent");
  }
  const pr=mine("Priest");
  if(pr){
    if(knows(pr,"UnbreakableWill")&&(theirs("Warlock")||theirs("Priest")||theirs("Rogue")||theirs("Paladin"))) out.push("Unbreakable Will: your Priest may shrug off their fear or stun");
    if(knows(pr,"Silence")&&casters.length) out.push(`Silence can lock their ${casters[0]} at the kill window`);
    if(knows(pr,"HolyNova")&&melee) out.push("Holy Nova punishes melee on your Priest");
    if(knows(pr,"PowerInfusion")&&wl) out.push("Power Infusion on your Warlock at the kill window");
  }
  const ro=mine("Rogue");
  if(ro&&prepFor(ro,"opener")==="Cheap Shot") out.push("Cheap Shot into Kidney Shot locks their healer");
  const pa=mine("Paladin");
  if(pa){
    const aura=prepFor(pa,"aura");
    if(aura==="Shadow Resistance Aura"&&(theirs("Warlock")||theirs("Priest"))) out.push("Shadow Resistance Aura softens their Shadow damage");
    if(aura==="Concentration Aura"&&(theirs("Shaman")||theirs("Rogue"))) out.push("Concentration Aura shortens their interrupts' lockouts");
    if(aura==="Devotion Aura"&&melee) out.push("Devotion Aura blunts their melee");
  }
  const stunners=opp.classes.filter(c=>["Rogue","Paladin","Warlock","Priest","Hunter","Mage","Druid"].includes(c));
  for(const c of S.team) if(hasItem(c,"Medallion of the Alliance")&&stunners.length) out.push(`Your ${c.cls}'s Medallion breaks their ${stunners[0]}'s crowd control once`);
  return {out,miss};
}

// ---- Helpers ----------------------------------------------------------------
const $app = document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function initials(name){return name.split(/[\s:]+/).filter(Boolean).map(w=>w[0]).join("").slice(0,3)}
function classIcon(cls,size=""){
  const c=CLASSES[cls];
  return `<img class="ico ${size}" style="border-color:${c.col}" alt="${cls}" src="${ICON_ROOT}icons/classes/${cls.toLowerCase()}.png" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ico ${size}',textContent:'${cls[0]}',style:'background:${c.col}'}))">`;
}
function abilityIcon(file){return `<img class="ico sm" alt="" src="${ICON_ROOT}icons/abilities/${file}.jpg" onerror="this.style.visibility='hidden'">`}
// Art: the checkout first, Wowhead's CDN second, initials last.
function artIcon(dir,file,label,size,bg){
  return `<img class="ico ${size}" alt="${esc(label)}" title="${esc(label)}" src="${ICON_ROOT}icons/${dir}/${file}.jpg" onerror="if(!this.dataset.cdn){this.dataset.cdn=1;this.src='${CDN}${file}.jpg'}else{this.replaceWith(Object.assign(document.createElement('span'),{className:'ico ${size}',textContent:'${initials(label)}',style:'background:${bg}'}))}">`;
}
function talentIcon(id,size="sm"){return artIcon("abilities",NODE[id].icon,NODE[id].name,size,"#8788EE")}
function itemIcon(g,size=""){return artIcon("items",g.icon,g.name,size,g.tier==="champion"?"#a335ee":"#0070dd")}
function pips(){
  let w="",l="";
  for(let i=0;i<MAX_WINS;i++) w+=`<span class="pip ${i<S.wins?"w":""}" title="win ${i+1}"></span>`;
  for(let i=0;i<MAX_LOSSES;i++) l+=`<span class="pip ${i<S.losses?"l":""}" title="loss ${i+1}"></span>`;
  return `<div class="record"><span>Wins</span><span class="pips">${w}</span><span>Losses</span><span class="pips">${l}</span><span class="note">Match ${matchNo()} · ${LEVELS[S.level][0]} · run seed ${S.seed}</span></div>`;
}
function specLine(c){const s=spec(c);return s.label?`<div class="spec">${esc(s.label)}${s.short?` · ${s.short}`:""}</div>`:""}
function picksTaken(c){return c.picks}
function teamStrip(){
  return `<div class="grid g2">${S.team.map(c=>`
    <div class="hstack">${classIcon(c.cls,"lg")}<div style="min-width:0"><div class="title" style="color:${CLASSES[c.cls].col}">${c.cls} ${c.unspent?`<span class="tag pts">${c.unspent} point${c.unspent>1?"s":""} to spend</span>`:""}</div>
    ${specLine(c)}
    <div class="meta">${earnedTotal(c)}/${pointCap()} points · ${c.picks}/${pickCap()} picks · budget ${Math.round(budget(c))} (+${Math.round(100*(budget(c)/KIT_BUDGET-1))}%)</div>
    <div class="row" style="gap:4px;margin-top:4px">${actingNodes(c).map(id=>talentIcon(id)).join("")}${Object.values(c.gear).map(g=>itemIcon(g,"sm")).join("")}</div></div></div>`).join("")}</div>`;
}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",6000)}
function showRecord(i){toast("A version-stamped match record: exact replay on this build; on another build, its stored result and combat log, with a labelled re-simulation. "+S.history[i].record)}
function go(screen){S.screen=screen;S.sel={};render();if(window.scrollTo)window.scrollTo(0,0)}

// ---- Screens ----------------------------------------------------------------
let MENU_LEVEL = 1;
function render(){
  if(!S){ $app.innerHTML = menu(); return; }
  ({draft,hub,talents,prepare,fight:drawFight,result,reward,end})[S.screen]();
}
function menu(){
  if(window.__ency) return encyclopedia();
  return `<div class="menu"><h2>ArenaSim</h2>
      ${saved?`<button class="btn primary" onclick="S=saved;saved=null;go('hub')">Continue run (${saved.wins}-${saved.losses})</button>`:""}
      <label class="f" style="width:280px">Difficulty<select onchange="MENU_LEVEL=+this.value;render()">${LEVELS.map((l,i)=>`<option value="${i}" ${i===MENU_LEVEL?"selected":""} ${levelUnlocked(i)?"":"disabled"}>${l[0]}${levelUnlocked(i)?"":` (clear ${LEVELS[i-1][0]})`}${P.clears[i]?` · cleared ${P.clears[i]}x`:""}</option>`).join("")}</select></label>
      <button class="btn ${saved?"":"primary"}" onclick="saved=null;newRun(null,MENU_LEVEL)">${saved?"Abandon and start a new run":"Gauntlet"}</button>
      <button class="btn" onclick="window.__ency=true;render()">Encyclopedia: Renown</button>

function bankAsGear(cls){const c=S.team.find(t=>t.cls===cls);c.gearPts+=c.unspent;c.unspent=0;render()}
function lockIn(){for(const c of S.team){for(const id of c.pending){c.ranks[id]=(c.ranks[id]||0)+1;c.unspent--}c.pending=[]}go("hub")}

// ---- The mock fight: a coin flip weighted by budget and answers -------------------
let F=null, timer=null;
function oppBudget(o){return KIT_BUDGET + 11*o.pts + (o.pts>=6?11:0) + o.picks*12 + o.champs*10}
function startFight(){
  const opp = opponent();
  const mine = S.team.reduce((s,c)=>s+budget(c),0)/2;
  const theirs = oppBudget(opp);
  const ans = answersFor(opp).out.length;
  const p = Math.max(.12, Math.min(.9, .58 + (mine-theirs)/theirs*1.2 + ans*.035 + (S.prep.kill===1?.03:0)));
  const win = rng() < p;
  F = {opp, p, win, t:0, called:S.prep.kill, hp:{a:[100,100],b:[100,100]}, log:[], speed:1, calls:0};
  F.log.push(`<b>0.0s</b> Gates open on ${opp.map}.`);
  for(const c of S.team){const s=spec(c);F.log.push(`<b>0.0s</b> [TALENTS] ${c.cls}: ${esc(s.label||"none")} ${s.short}`)}
  go("fight"); tick();
}
function tick(){
  clearTimeout(timer);
  if(!F||S.screen!=="fight") return;
  F.t += 1.5;
  const loserSide = F.win ? "b":"a", winSide = F.win ? "a":"b";
  const dmg = (side,i,amt)=>{F.hp[side][i]=Math.max(0,F.hp[side][i]-amt)};
  const kt = loserSide==="b" ? F.called : 1;
  dmg(loserSide, kt, 6+rng()*9); dmg(winSide, Math.floor(rng()*2), 2+rng()*6);
  const names = {a:S.team.map(c=>c.cls), b:F.opp.classes};
  const lines = [
    `${names.b[0]} casts ${KIT[names.b[0]]} on ${names.a[1]}.`,
    `${names.a[0]} casts ${KIT[names.a[0]]} on ${names.b[F.called]}.`,
    `${names.a[1]} casts ${KIT[names.a[1]]}.`,
    `${names.b[1]} casts ${KIT[names.b[1]]}.`];
  for(const c of S.team){
    for(const id of actingNodes(c)) if(NODE[id].kind!=="Widens choice") lines.push(`${c.cls}: ${NODE[id].name}.`);
    for(const g of Object.values(c.gear)) if(g.effect) lines.push(`${c.cls} uses ${g.name}.`);
  }
  F.log.push(`<b>${F.t.toFixed(1)}s</b> ${esc(lines[Math.floor(rng()*lines.length)])}`);
  const done = F.hp[loserSide].some(h=>h<=0) || F.t>=60;
  if(done){
    if(!F.hp[loserSide].some(h=>h<=0)) F.hp[loserSide][kt]=0;
    const dead = F.hp[loserSide].findIndex(h=>h<=0);
    F.log.push(`<b>${F.t.toFixed(1)}s</b> ${names[loserSide][dead]} dies. ${F.win?"Victory.":"Defeat."}`);
    drawFight(); timer=setTimeout(finishFight,900); return;
  }
  drawFight(); timer=setTimeout(tick, 700/F.speed);
}
function callTarget(i){if(!F)return;F.called=i;F.calls++;F.log.push(`<b>${F.t.toFixed(1)}s</b> Kill call: ${F.opp.classes[i]}. Your team switches.`);drawFight()}
function drawFight(){
  const frame=(c,hp,enemy,i)=>`<${enemy?"button":"div"} class="frame ${enemy?"enemy":""} ${enemy&&F.called===i?"called":""}" ${enemy?`onclick="callTarget(${i})" title="Click to call this kill target"`:""}>
    ${classIcon(c.cls,"sm")}<span style="width:62px">${c.cls}</span><span class="bar"><i style="width:${hp}%;background:${hp<35?"var(--loss)":"var(--win)"}"></i></span>
    <span class="row" style="gap:2px">${actingNodes(c).slice(0,4).map(id=>talentIcon(id)).join("")}${Object.values(c.gear).filter(g=>g.effect).map(g=>itemIcon(g,"sm")).join("")}</span></${enemy?"button":"div"}>`;
  $app.innerHTML = `<h2>${esc(F.opp.name)} · ${F.opp.map}</h2><p class="sub">Stand-in for PlayMatch. Icons on a frame are the talents and trinkets that act in the fight. Click an enemy frame to make a kill call.</p>
  <div class="panel"><div class="frames">
    <div><div class="meta" style="color:var(--t1)">Your team</div>${S.team.map((c,i)=>frame(c,F.hp.a[i],false,i)).join("")}</div>
    <div><div class="meta" style="color:var(--t2)">${esc(F.opp.name)}</div>${F.opp.builds.map((c,i)=>frame(c,F.hp.b[i],true,i)).join("")}</div></div>
    <div class="log" id="log">${F.log.join("<br>")}</div>
    <div class="actions" style="margin-top:10px"><span class="note" style="margin-right:auto">${F.t.toFixed(1)}s</span>
    ${[1,2,3].map(s=>`<button class="btn ${F.speed===s?"primary":""}" onclick="F.speed=${s};drawFight()">${s}x</button>`).join("")}</div></div>`;
  const l=document.getElementById("log"); if(l) l.scrollTop=l.scrollHeight;
}
const MAP_IDS = {"Basic Arena":"BasicArena","Nagrand Arena":"PillaredArena","Twin Pillars":"TwinPillars"};
const GAME_VERSION = "0.8.0-proto", CONTENT_HASH = "c0ffee12";
function finishFight(){
  if(F.win) S.wins++; else S.losses++;
  const record = JSON.stringify({game_version:GAME_VERSION, content_hash:CONTENT_HASH, team1:S.team.map(c=>c.cls), team2:F.opp.classes, map:MAP_IDS[F.opp.map], random_seed:S.seed+S.history.length, team1_builds:S.team.map(c=>c.ranks), team1_gear:S.team.map(c=>Object.values(c.gear).map(g=>g.name)), kill_calls:F.calls});
  // MatchFacts, mocked: in the game they are derived from the match result and the combat log's structured events.
  const ccClasses = ["Warlock","Rogue","Paladin","Priest","Mage","Druid","Hunter"];
  const facts = {won:F.win, oneVsOne: rng()<0.3, cleanKill: F.win && S.team.some(c=>ccClasses.includes(c.cls)) && rng()<0.25};
  if(S.forceFacts){Object.assign(facts,S.forceFacts);S.forceFacts=null}
  S.history.push({opp:F.opp.name, classes:F.opp.classes, tier:F.opp.tier, won:F.win, t:F.t, record, facts, specs:S.team.map(c=>spec(c).short)});
  S.newAwards = evaluate("match", facts, `run ${P.runs+1}, match ${S.history.length}`);
  const over = S.wins>=MAX_WINS || S.losses>=MAX_LOSSES;
  S.lastWon = F.win;
  S.gains = {};
  if(!over) for(const c of S.team){
    const pt = earnedTotal(c) < pointCap(); if(pt) c.unspent++;
    const pk = c.picks < pickCap();
    S.gains[c.cls] = {pt, pk};
  }
  if(over){
    const runRecord = {cleared:S.wins>=MAX_WINS, level:S.level, losses:S.losses, team:S.team.map(c=>c.cls), tiersEquipped:S.tiersEquipped, matches:S.history.map(h=>h.facts)};
    S.runEnd = endOfRun(runRecord);
  }
  S.opp = null; S.offers = null;
  go("result");
}
function result(){
  const won = F.win;
  const over = S.wins>=MAX_WINS || S.losses>=MAX_LOSSES;
  const odds = Math.round(F.p*100);
  $app.innerHTML = `<h2>Results</h2>${pips()}
  <div class="panel" style="margin-top:12px"><div class="big ${won?"win":"loss"}">${won?"Victory":"Defeat"}</div>
  <div class="meta">vs ${esc(F.opp.name)} (${F.opp.classes.join(" + ")}) · ${F.t.toFixed(1)}s · ${F.calls} kill call${F.calls===1?"":"s"}</div>
  <p class="note">The real Results screen sits here unchanged: damage, healing, CC breakdown and the combat log, with each combatant's spec under its name.</p>
  ${over?"":S.team.map(c=>{const g=S.gains[c.cls];return `<div class="panel" style="background:var(--panel2);margin-top:8px"><b style="color:${CLASSES[c.cls].col}">${c.cls}</b> ${g.pt?'<span class="tag pts">+1 talent point</span>':'<span class="tag">talent points capped</span>'} ${g.pk?'<span class="tag pts">+1 reward pick</span>':'<span class="tag">reward picks capped</span>'}</div>`}).join("")}
  ${!over&&won?'<p class="note">A win: Champion items can appear among the offers.</p>':!over?'<p class="note">A loss still pays a point and a pick, and the same tier comes again.</p>':""}
  <div class="panel" style="background:var(--panel2);margin-top:8px"><div class="meta">Later idea · rematch odds</div>
  Twenty background re-simulations of this matchup: your setup wins about <b>${odds}%</b>. ${won? (odds<45?"You beat the odds.":"A sound setup."): (odds>=55?"That one was the dice.":"The setup was the problem; try another answer.")}</div></div>
  ${awardLines(S.newAwards)}
  <div class="actions"><button class="btn" onclick="showRecord(${S.history.length-1})">Match record</button>
  <button class="btn primary" onclick="go('${over?"end":S.team.some(c=>S.gains[c.cls].pk)?"reward":"hub"}')">${over?"Finish run":"Continue run"}</button></div>`;
}
function awardLines(ids){
  return ids.map(id=>{const r=RENOWN.find(x=>x[0]===id);return `<div class="panel" style="background:var(--panel2);margin-top:8px;border-color:var(--gold)"><span class="tag pts">Renown unlocked</span> <b>${esc(r[1])}</b>: ${esc(effectText(r[3]))}, from your next run. <span class="meta">${esc(conditionText(r))}</span></div>`}).join("");
}
function reward(){
  if(!S.offers){S.offers={};for(const c of S.team) if(S.gains[c.cls].pk) S.offers[c.cls]=offersFor(c,S.lastWon)}
  const ready = Object.keys(S.offers).every(cls=>S.sel[cls]!==undefined || !S.offers[cls].length);
  $app.innerHTML = `<h2>Rewards</h2><p class="sub">One pick for each combatant, up to ${pickCap()}. ${S.lastWon?"After a win, a Champion item (purple) may be offered.":"After a loss, Gauntlet gear only."} The gain is against what the slot holds now.</p>
  ${S.team.filter(c=>S.offers[c.cls]).map(c=>`<div class="panel" style="margin-bottom:12px"><div class="hstack" style="justify-content:space-between;flex-wrap:wrap"><h3 style="color:${CLASSES[c.cls].col}">${c.cls} · pick ${c.picks+1} of ${pickCap()}</h3>
    ${S.rerolls>0?`<button class="btn" onclick="S.rerolls--;S.offers['${c.cls}']=offersFor(S.team.find(t=>t.cls==='${c.cls}'),S.lastWon);delete S.sel['${c.cls}'];render()">Reroll (${S.rerolls} left)</button>`:""}</div>
    <div class="grid g3">${S.offers[c.cls].map((o,i)=>`<button class="card ${S.sel[c.cls]===i?"sel":""}" style="border-color:${S.sel[c.cls]===i?"var(--gold)":o.tier==="champion"?"#a335ee":"#2a5d9a"}" onclick="S.sel['${c.cls}']=${i};render()">
      <div class="hstack">${itemIcon(o)}<div><div class="title" style="color:${o.tier==="champion"?"#c77dff":"#5aa0ff"}">${esc(o.name)}</div><div class="meta">${o.tier==="champion"?"Champion":"Gauntlet"} · ilvl ${o.ilvl} · ${o.slot}</div></div></div>
      <div class="delta"><span class="up">+${Math.round(o.gain)} budget on this slot</span> · ${esc(o.stats)}${o.effect?`<br><span style="color:#c77dff">${esc(o.effect)}</span>`:""}</div></button>`).join("")}</div></div>`).join("")}
  <div class="actions"><button class="btn primary" ${ready?"":"disabled"} onclick="takeRewards()">Take them</button></div>`;
}
function takeRewards(){
  for(const c of S.team){
    const offers=S.offers[c.cls]; if(!offers||!offers.length) continue;
    const o=offers[S.sel[c.cls]], prev=c.gear[o.slot];
    c.gear[o.slot]=Object.assign({},o,{gainTotal:(prev?prev.gainTotal:0)+o.gain});
    if(!S.tiersEquipped.includes(o.tier)) S.tiersEquipped.push(o.tier);
    c.picks++;
  }
  S.offers=null; go("hub");
}
function end(){
  const re = S.runEnd;
  $app.innerHTML = `<h2>Run complete</h2>${pips()}
  <div class="panel" style="margin-top:12px"><div class="big ${S.wins>=MAX_WINS?"win":""}">${S.wins} win${S.wins===1?"":"s"}${S.wins>=MAX_WINS?` · cleared at ${LEVELS[S.level][0]}`:""}</div>
  ${teamStrip()}</div>
  <div class="panel" style="margin-top:12px"><h3>Renown</h3>
    ${re.awards.length?awardLines(re.awards):`<p class="note">${S.wins>=MAX_WINS?"No new renown this run.":"No clear this time; nothing is lost."} The encyclopedia lists what is still locked.</p>`}
    ${S.wins>=MAX_WINS?`<p>Title: ${LEVELS[S.level][0]}.${re.unlockedLevel?` <b>${re.unlockedLevel}</b> difficulty unlocked.`:""}</p>`:""}</div>
  <div class="panel" style="margin-top:12px"><div class="meta">What persists: clears, titles, renown abilities, records and saved talent plans. No run's points or gear carry into the next.</div>
  ${S.team.filter(c=>hasTree(c.cls)).map(c=>`<div style="margin-top:6px"><b style="color:${CLASSES[c.cls].col}">${c.cls}</b> ${esc(spec(c).label)} ${spec(c).short}: ${Object.keys(c.ranks).map(id=>`${esc(NODE[id].name)} ${c.ranks[id]}`).join(", ")}</div>`).join("")}</div>
  <div class="panel matchlist" style="margin-top:12px"><div class="meta">Each match keeps a version-stamped record: exact on this build, a labelled re-simulation on another.</div>
  ${S.history.map((h,i)=>`<div class="m"><span>${i+1}. <span class="${h.won?"win":"loss"}">${h.won?"W":"L"}</span> vs ${esc(h.opp)} (${h.classes.join(" + ")}) · your specs ${h.specs.filter(Boolean).join(", ")}</span>
  <button class="btn" onclick="showRecord(${i})">Match record</button></div>`).join("")}</div>
  <div class="actions"><button class="btn" onclick="S=null;render()">Main menu</button><button class="btn" onclick="S=null;window.__ency=true;render()">Encyclopedia: Renown</button><button class="btn primary" onclick="newRun(null,S.level)">New run</button></div>`;
}
render();
</script>
</body>
</html>
