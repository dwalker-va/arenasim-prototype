<!doctype html>
<!-- ArenaSim Dispatch, served by tools/dispatch-board (node dist/cli.js serve).
     Ported from the claude.ai artifact: same look and gestures, persistence
     swapped for the local daemon's versioned JSON API. -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ArenaSim Dispatch</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"><link rel="stylesheet" href="/theme.css"><link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"><style id="css">
.boardwrap{overflow-x:auto;padding:6px 20px 24px}
.board{display:grid;grid-template-columns:repeat(6,minmax(216px,1fr));gap:12px;min-width:1344px;align-items:stretch}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:120px;display:flex;flex-direction:column}
.col.dragover{border-color:var(--c-progress);background:var(--surface)}
.colhead{display:flex;align-items:baseline;gap:8px;padding:2px 4px 8px}
.colhead .nm{font:600 14px/1 "Barlow Semi Condensed",sans-serif;text-transform:uppercase;letter-spacing:.07em}
.colhead .ct{font:500 11.5px "IBM Plex Mono",monospace;color:var(--muted)}
.colhead .hint{margin-left:auto;color:var(--muted);font-size:11px}
.col[data-col="backlog"] .nm{color:var(--c-backlog)}
.col[data-col="needs_input"] .nm{color:var(--c-input)}
.col[data-col="in_progress"] .nm{color:var(--c-progress)}
.col[data-col="review"] .nm{color:var(--c-review)}
.col[data-col="merged"] .nm{color:var(--c-merged)}
.col[data-col="done"] .nm{color:var(--c-done)}
.col[data-col="archived"]{border-style:dashed}
.col[data-col="archived"] .nm{color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:8px;min-height:36px;flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-left-width:3px;border-radius:8px;padding:9px 11px;box-shadow:var(--shadow);cursor:pointer}
.card.p-P1{border-left-color:var(--p1)}
.card.p-P2{border-left-color:var(--p2)}
.card.p-P3{border-left-color:var(--p3)}
.card .top{display:flex;gap:8px;align-items:baseline}
.card .cid{font:500 11px "IBM Plex Mono",monospace;color:var(--muted)}
.card .pri{margin-left:auto;font:500 10.5px "IBM Plex Mono",monospace;color:var(--muted)}
.card .ttl{font-weight:500;margin:3px 0 6px;line-height:1.35}
.card .foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(10,14,18,.45);display:flex;justify-content:flex-end;z-index:20}
.overlay.center{justify-content:center;align-items:flex-start;padding-top:9vh}
.drawer{width:min(430px,94vw);height:100%;overflow-y:auto;background:var(--surface);border-left:1px solid var(--line);padding:18px 20px 30px}
.modal{width:min(480px,94vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;height:fit-content;box-shadow:var(--shadow)}
.drawer h2,.modal h2{font:600 17px "Barlow Semi Condensed",sans-serif;margin:0 0 2px;letter-spacing:.03em}
.qbox{margin-top:14px;border:1px solid var(--c-input);border-radius:8px;padding:10px 12px;background:var(--surface2)}
.qbox .qt{font-weight:600;color:var(--c-input);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.stale{margin-top:12px;border:1px solid var(--p1);border-radius:8px;padding:10px 12px;background:var(--surface2);font-size:12.5px}
.stale .qt{font-weight:600;color:var(--p1);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.claim{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--c-progress)}
.act{margin-top:18px}
.act h3{font:600 12px "Barlow Semi Condensed",sans-serif;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px}
.aitem{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:12.5px}
.aitem .at{font:400 11px "IBM Plex Mono",monospace;color:var(--muted);white-space:nowrap;padding-top:1px}
.aitem .aby{font-weight:600;color:var(--muted)}
.links{display:flex;flex-direction:column;gap:3px;margin-top:10px}
.links h3,.ownpr h3{font:600 12px "Barlow Semi Condensed",sans-serif;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 2px}
.ownpr{margin-top:12px}
.ownpr a{color:var(--c-progress);font-size:13px;font-weight:600;text-decoration:none}
.wt{display:flex;gap:6px;align-items:center;margin-top:6px;font:400 11px "IBM Plex Mono",monospace;color:var(--muted);min-width:0}
.wt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wt button,.wtcopy{border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:5px;padding:0 6px;font:500 10.5px "IBM Plex Sans",sans-serif;flex:none}
.wtrow{display:flex;gap:8px}
.wtrow input{flex:1;min-width:0;font:400 12px "IBM Plex Mono",monospace!important}
.wtold{margin-top:12px;font-size:12px;color:var(--muted)}
.wtold input{width:100%;font:400 11.5px "IBM Plex Mono",monospace;color:var(--muted);background:none;border:none;padding:0}
.links a{color:var(--c-progress);font-size:13px;text-decoration:none}
.links a:hover{text-decoration:underline}
.spec{white-space:pre-wrap;font-size:13px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:4px}
.tag.ms{color:var(--c-merged);font-weight:500}
.msbar{display:flex;gap:8px;align-items:center}
.msbar select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
a.btn{text-decoration:none;display:inline-block}
.dsec{margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
.dsec h3{font:600 12px "Barlow Semi Condensed",sans-serif;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0}
.mrow textarea.short{min-height:64px}
.ruling{padding:5px 0;border-top:1px solid var(--line);font-size:12.5px}
.ruling .at{font:400 11px "IBM Plex Mono",monospace;color:var(--muted)}
.ruling .nums{font:400 11.5px "IBM Plex Mono",monospace;color:var(--muted)}
.rulerow{display:flex;gap:8px;margin-top:6px}
.rulerow input{flex:1;min-width:0;font:inherit;font-size:13px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.kv{font-size:12.5px;color:var(--muted);margin-top:6px}
.closex{position:sticky;top:0;float:right;border:none;background:none;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px}
@media (prefers-reduced-motion: no-preference){.card{transition:box-shadow .12s}.card:hover{box-shadow:0 2px 6px rgba(20,26,33,.16),0 8px 20px rgba(20,26,33,.10)}}
</style></head><body><div id="app"></div><script id="code">
(function(){
"use strict";
// Ported from the ArenaSim Dispatch artifact. The look, the columns, the
// drawer, the question box and the PR-link gate are the artifact's; what
// changed is persistence: every gesture is one versioned write to the local
// daemon (actor "board"), and the page refreshes live from its event stream.
//
// The drawer never writes a value the user did not change. Its edits are
// based on one version of the card (`base`: the version it opened on, or
// the one the user explicitly rebased onto); Save sends only the fields the
// user changed, conditioned on the base's version, so a write that landed
// meanwhile either survives (fields the user left alone are never sent) or
// refuses the save (the version check). While the drawer has no edits, a
// live refresh simply moves the base forward.
//
// "Changed" means the input differs from the value the drawer last RENDERED
// into it — DOM against DOM, never DOM against the card. So the browser's
// normalisation (a <textarea> drops a leading newline and turns CRLF into
// LF) is never mistaken for an edit, and a field the user left alone follows
// every refresh even while the base is held for the fields they did touch.
var COLUMNS = [
  {key:"backlog", label:"Backlog", hint:"queued"},
  {key:"needs_input", label:"Needs Input", hint:"blocked on you"},
  {key:"in_progress", label:"In Progress", hint:"spawns an agent"},
  {key:"review", label:"Review", hint:"awaiting verification"},
  {key:"merged", label:"Merged", hint:"awaiting milestone review"},
  {key:"done", label:"Done", hint:"milestone reviewed"}
];
var ARCHIVED = {key:"archived", label:"Archived", hint:"released"};
var ROLES = ["engineer","tester","release-manager","pm"];
var GATED = ["review","merged"];
var AREAS = ["combat","visuals","ai","ui","tooling"];
// Drawer field -> its input. The drawer's edits are these inputs, diffed against `rendered`.
var DRAWER = {title: "d-title", body: "d-body", column: "d-col", role: "d-role", priority: "d-pri",
              milestone: "d-ms", area: "d-area", summary: "d-summary", human_testing: "d-ht"};

var state = {cards: [], milestones: []};
// The milestone filter: "" shows every card, NO_MS the cards on none, else one milestone's. Kept in the URL (?m=).
var NO_MS = "-";
var params = new URLSearchParams(location.search);
var msFilter = params.get("m") || "";
var showNewMs = false;
var full = {};            // id -> full card (body + activity), fetched when its drawer opens
var connected = false, loadedOnce = false;
var openCardId = null, showNew = false, confirmDelete = false, statusMsg = "connecting…", showArchived = false;
var pending = null;       // {id, column, patch, why, expected}: a gated move waiting on the PR-link dialog
var base = null;          // the open drawer's card as its edits are based on: {id, version, title, body, column, role, priority}
var confirmRelease = false, discardDraft = false;
var rendered = {}, renderedFor = null;   // input id -> the value the drawer last rendered into it, for card `renderedFor`
var app = document.getElementById("app");

function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmt(t){
  // Board timestamps are UTC without a zone suffix.
  try{ var s=String(t); if(/^\d{4}-\d\d-\d\dT\d\d:\d\d(:\d\d)?$/.test(s)) s+="Z";
    var d=new Date(s); if(isNaN(d)) return t; return d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }
  catch(e){ return t; }
}
function card(id){ for(var i=0;i<state.cards.length;i++) if(state.cards[i].id===id) return state.cards[i]; return null; }
// The card's OWN PR is `pr`; `links` are references and never satisfy the gate.
// The board's own PR-URL definition (board.ts PR_URL), put here by the daemon
// when it serves this page — never a second copy that could drift from it.
var PR_URL = /*@PR_URL*/null;
function hasPr(c){ return !!(c.pr && typeof c.pr.url === "string" && PR_URL.test(c.pr.url)); }
function gated(c, col){ return GATED.indexOf(col) >= 0 && c.role !== "pm" && !hasPr(c); }
// The worktree is shown where the user might test the card: while it is live.
var WT_COLUMNS = ["in_progress","review","merged"];
function copyText(text){
  function fallback(){
    var ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); var ok = false; try{ ok = document.execCommand("copy"); }catch(e){} document.body.removeChild(ta); return ok;
  }
  function done(ok){ statusMsg = ok ? "copied " + text : "copy failed — select the path and copy it"; render(); }
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(fallback()); });
  else done(fallback());
}
function str(v){ return v == null ? "" : String(v); }
function snapshot(c){
  return {id: c.id, version: c.version, title: str(c.title), body: str(c.body),
          column: c.column, role: str(c.role), priority: str(c.priority),
          milestone: str(c.milestone), area: str(c.area), summary: str(c.summary), human_testing: str(c.human_testing)};
}
function milestone(name){ for(var i=0;i<state.milestones.length;i++) if(state.milestones[i].name===name) return state.milestones[i]; return null; }
function inFilter(c){ return !msFilter || (msFilter === NO_MS ? c.milestone == null : c.milestone === msFilter); }
function setFilter(v){
  msFilter = v;
  var q = new URLSearchParams(location.search);
  if(v) q.set("m", v); else q.delete("m");
  if(!params.get("card")) q.delete("card");
  var qs = q.toString();
  try{ history.replaceState(null, "", location.pathname + (qs ? "?" + qs : "")); }catch(e){}
}
// The user's edits: drawer fields whose value (from `values`, input id ->
// value) differs from what the drawer last rendered into them.
function drawerEdits(values, id){
  var out = {};
  if(!id || renderedFor !== id) return out;
  Object.keys(DRAWER).forEach(function(k){
    var f = DRAWER[k], v = values[f];
    if(v !== undefined && rendered[f] !== undefined && v !== rendered[f]) out[k] = v;
  });
  return out;
}
function drawerValues(){
  var v = {};
  Object.keys(DRAWER).forEach(function(k){ var el = document.getElementById(DRAWER[k]); if(el) v[DRAWER[k]] = el.value; });
  return v;
}

function api(method, path, body){
  var opts = {method: method, headers: {}};
  if(body !== undefined){ opts.headers["content-type"] = "application/json"; opts.body = JSON.stringify(body); }
  return fetch(path, opts).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(b){ return {status: r.status, body: b}; });
  });
}

var loading = false, reload = false;
function load(){
  if(loading){ reload = true; return; }
  loading = true;
  api("GET", "/api/board").then(function(r){
    loading = false;
    if(r.status !== 200) throw new Error("HTTP " + r.status);
    state.cards = r.body.cards; state.milestones = r.body.milestones || []; loadedOnce = true;
    if(openCardId && card(openCardId) && full[openCardId] && full[openCardId].version !== card(openCardId).version) fetchFull(openCardId);
    render();
    if(reload){ reload = false; load(); }
  }).catch(function(){ loading = false; connected = false; statusMsg = "daemon unreachable — retrying"; render(); });
}
function fetchFull(id){
  return api("GET", "/api/cards/" + encodeURIComponent(id)).then(function(r){
    if(r.status === 200){ full[id] = r.body; render(); }
    else if(r.status === 404 && openCardId === id){ openCardId = null; render(); }
  });
}

// One place that turns a write's response into board feedback.
function afterWrite(r, okMsg){
  if(r.status === 200){ statusMsg = okMsg || ("saved " + fmt(new Date().toISOString().slice(0,19))); }
  else if(r.status === 409){ statusMsg = "changed elsewhere — not saved; see the card"; }
  else { statusMsg = (r.body && r.body.message) || ("save failed (HTTP " + r.status + ")"); }
  load();
  return r.status === 200;
}

// A move from `from` (the column the gesture saw) at `expected` (the version it
// saw: the board's for a drag, the drawer's base for a drawer save).
function moveCard(id, col, why, patch, expected, from){
  var c = card(id); if(!c) return;
  from = from || c.column;
  if(from === col) return;
  if(expected === undefined) expected = c.version;
  // The board refuses these too; say why here instead of opening the PR dialog first.
  if(col === "merged" && !c.merge_sha){ statusMsg = "Merged is recorded by the orchestrator when it merges the PR (mark_merged)"; render(); return; }
  var withLinks = patch && patch.pr ? Object.assign({}, c, {pr: patch.pr}) : c;
  if(gated(withLinks, col)){ pending = {id: id, column: col, patch: patch || {}, why: why, expected: expected, from: from}; render(); return; }
  var body = {column: col, expected_version: expected, activity: (why || "Moved") + ": " + from + " → " + col};
  if(patch && Object.keys(patch).length) body.patch = patch;
  statusMsg = "saving…"; render();
  return api("POST", "/api/cards/" + encodeURIComponent(id) + "/move", body).then(function(r){ return afterWrite(r); });
}

function cardHtml(c){
  var tags = "";
  if(c.column === "needs_input" && c.question && c.question.text) tags += "<span class=\"tag q\">? waiting on answer</span>";
  if(c.milestone) tags += "<span class=\"tag ms\">" + esc(c.milestone) + (c.iteration > 1 ? " · it " + esc(c.iteration) : "") + "</span>";
  if(c.column === "merged") tags += "<span class=\"tag hum\">" + (c.merge_sha ? "merged " + esc(String(c.merge_sha).slice(0,7)) : "merge not recorded") + "</span>";
  if(c.agent && c.agent.status === "working") tags += "<span class=\"tag agent\">agent working since " + esc(fmt(c.agent.started)) + "</span>";
  if(c.released) tags += "<span class=\"tag rel\">released " + esc(c.released) + "</span>";
  if(hasPr(c)) tags += "<span class=\"tag own\"><a href=\"" + esc(c.pr.url) + "\" target=\"_blank\" rel=\"noopener\">PR #" + esc(c.pr.number) + "</a></span>";
  for(var i=0;i<(c.links||[]).length;i++){
    tags += "<span class=\"tag\"><a href=\"" + esc(c.links[i].url) + "\" target=\"_blank\" rel=\"noopener\">" + esc(c.links[i].label) + "</a></span>";
  }
  return "<div class=\"card p-" + esc(c.priority) + "\" draggable=\"" + connected + "\" tabindex=\"0\" data-id=\"" + esc(c.id) + "\">"
    + "<div class=\"top\"><span class=\"cid\">" + esc(c.id) + "</span><span class=\"pri\">" + esc(c.priority) + "</span></div>"
    + "<div class=\"ttl\">" + esc(c.title) + "</div>"
    + "<div class=\"foot\"><span class=\"chip " + (c.role==="engineer"?"engineer":"") + "\">" + esc(c.role) + "</span>" + tags + "</div>"
    + (c.worktree && WT_COLUMNS.indexOf(c.column) >= 0
        ? "<div class=\"wt\" title=\"" + esc(c.worktree) + "\"><span>" + esc(c.worktree.split("/").filter(Boolean).pop() || c.worktree) + "</span>"
          + "<button class=\"wtcopy\" data-path=\"" + esc(c.worktree) + "\" aria-label=\"Copy worktree path\">copy path</button></div>"
        : "")
    + "</div>";
}

function drawerHtml(s, edits){
  var c = full[s.id];
  var ro = !connected;
  if(!c){
    return "<div class=\"overlay\" id=\"ovl\"><div class=\"drawer\" role=\"dialog\" aria-label=\"Card detail\">"
      + "<button class=\"closex\" id=\"d-close\" aria-label=\"Close\">×</button><div class=\"stat\">loading " + esc(s.id) + "…</div></div></div>";
  }
  var q = "";
  if(c.question && c.question.text && !c.question.answer){
    q = "<div class=\"qbox\"><div class=\"qt\">Agent needs input</div><div>" + esc(c.question.text) + "</div>"
      + "<div class=\"mrow\"><label for=\"d-answer\">Answer</label><textarea id=\"d-answer\" " + (ro?"disabled":"") + "></textarea></div>"
      + "<div class=\"dactions\"><button class=\"btn primary\" id=\"d-answerbtn\" " + (ro?"disabled":"") + ">Answer &amp; resume</button></div></div>";
  }
  var links = "";
  for(var i=0;i<(c.links||[]).length;i++) links += "<a href=\"" + esc(c.links[i].url) + "\" target=\"_blank\" rel=\"noopener\">" + esc(c.links[i].label) + "</a>";
  var ownPr = hasPr(c) ? "<div class=\"ownpr\"><h3>Pull request</h3><a href=\"" + esc(c.pr.url) + "\" target=\"_blank\" rel=\"noopener\">PR #" + esc(c.pr.number) + "</a>"
    + (c.merge_sha ? " <span class=\"stat\">merged at " + esc(String(c.merge_sha).slice(0,10)) + "</span>" : (c.column === "merged" ? " <span class=\"stat\">merge not recorded</span>" : "")) + "</div>" : "";
  // The milestone fields: what the milestone review page is assembled from.
  var msOpts = "<option value=\"\"" + (c.milestone ? "" : " selected") + ">none</option>", known = false;
  state.milestones.forEach(function(m){
    var cur = c.milestone === m.name; if(cur) known = true;
    if(m.status === "released" && !cur) return;   // a released milestone takes no new cards
    msOpts += "<option value=\"" + esc(m.name) + "\"" + (cur ? " selected" : "") + ">" + esc(m.name) + (m.status === "released" ? " (released)" : "") + "</option>";
  });
  if(c.milestone && !known) msOpts += "<option value=\"" + esc(c.milestone) + "\" selected>" + esc(c.milestone) + "</option>";
  var areaOpts = "<option value=\"\"" + (c.area ? "" : " selected") + ">—</option>";
  AREAS.concat(c.area && AREAS.indexOf(c.area) < 0 ? [c.area] : []).forEach(function(a){ areaOpts += "<option" + (c.area === a ? " selected" : "") + ">" + esc(a) + "</option>"; });
  var rulings = (c.rulings || []).map(function(r){
    var nums = r.numbers ? Object.keys(r.numbers).map(function(k){ return esc(k) + " " + esc(r.numbers[k]); }).join(" · ") : "";
    return "<div class=\"ruling\"><span class=\"at\">" + esc(fmt(r.t)) + " · " + esc(r.by) + "</span><div>" + esc(r.text) + "</div>" + (nums ? "<div class=\"nums\">" + nums + "</div>" : "") + "</div>";
  }).join("");
  var kv = "";
  if(c.milestone) kv += "<div class=\"kv\">Iteration " + esc(c.iteration || 1) + "</div>";
  if(c.sweep) kv += "<div class=\"kv\">Sweep: " + esc(c.sweep.status) + (c.sweep.summary ? " — " + esc(c.sweep.summary) : "") + "</div>";
  if(c.gaps) kv += "<div class=\"kv\">Stated gaps: " + esc(c.gaps) + "</div>";
  var msSec = "<div class=\"dsec\"><h3>Milestone</h3>"
    + "<div class=\"tworow\"><div class=\"mrow\"><label for=\"d-ms\">Milestone</label><select id=\"d-ms\" " + (ro?"disabled":"") + ">" + msOpts + "</select></div>"
    + "<div class=\"mrow\"><label for=\"d-area\">Area</label><select id=\"d-area\" " + (ro?"disabled":"") + ">" + areaOpts + "</select></div></div>"
    + "<div class=\"mrow\"><label for=\"d-summary\">Summary (what changed)</label><textarea class=\"short\" id=\"d-summary\" " + (ro?"disabled":"") + ">" + esc(c.summary) + "</textarea></div>"
    + "<div class=\"mrow\"><label for=\"d-ht\">Human testing (one step per line)</label><textarea class=\"short\" id=\"d-ht\" " + (ro?"disabled":"") + ">" + esc(c.human_testing) + "</textarea></div>"
    + kv
    + "<div class=\"mrow\"><label for=\"d-ruling\">Rulings</label>" + (rulings || "<div class=\"kv\">none recorded</div>")
    + "<div class=\"rulerow\"><input id=\"d-ruling\" placeholder=\"Record a decision (dated, append-only)\" " + (ro?"disabled":"") + "><button class=\"btn\" id=\"d-rulingbtn\" " + (ro?"disabled":"") + ">Record</button></div></div>"
    + "</div>";
  // Live card: the path to cd into, with a copy button. Done/archived: kept
  // for the record, de-emphasised (the tree has probably been cleaned up).
  var wt = "";
  if(c.worktree && WT_COLUMNS.indexOf(c.column) >= 0){
    wt = "<div class=\"mrow\"><label for=\"d-worktree\">Worktree</label><div class=\"wtrow\"><input id=\"d-worktree\" readonly value=\"" + esc(c.worktree) + "\">"

  } else if(c.worktree){
    wt = "<div class=\"wtold\">Worktree (may have been cleaned up)<input id=\"d-worktree\" readonly value=\"" + esc(c.worktree) + "\"></div>";
  }
  var acts = "", al = c.activity || [];
  for(var j=al.length-1;j>=0;j--){
    var a = al[j];
    acts += "<div class=\"aitem\"><span class=\"at\">" + esc(fmt(a.t)) + "</span><span><span class=\"aby\">" + esc(a.by) + "</span> — " + esc(a.msg) + "</span></div>";
  }
  var colOpts = "", roleOpts = "", priOpts = "";
  for(var k=0;k<COLUMNS.length;k++) colOpts += "<option value=\"" + COLUMNS[k].key + "\"" + (c.column===COLUMNS[k].key?" selected":"") + ">" + COLUMNS[k].label + "</option>";
  colOpts += "<option value=\"archived\"" + (c.column==="archived"?" selected":"") + ">Archived</option>";
  for(var r=0;r<ROLES.length;r++) roleOpts += "<option" + (c.role===ROLES[r]?" selected":"") + ">" + ROLES[r] + "</option>";
  var pris = ["P1","P2","P3"]; if(c.priority && pris.indexOf(c.priority) < 0) pris.push(c.priority);
  if(!c.priority) priOpts += "<option value=\"\" selected>—</option>";   // legacy card with no priority: show it unset, don't invent one
  pris.forEach(function(p){ priOpts += "<option" + (c.priority===p?" selected":"") + ">" + esc(p) + "</option>"; });
  // The drawer holds edits based on an older version: say so, name what moved,
  // and make adopting the new version the user's act, not a silent rebase.
  var stale = "";
  if(base && base.id === c.id && base.version !== c.version){
    var now = snapshot(c), moved = [];
    Object.keys(DRAWER).forEach(function(k){ if(now[k] !== base[k]) moved.push(k === "body" ? "spec" : k); });
    var clash = moved.filter(function(k){ return edits[k === "spec" ? "body" : k] !== undefined; });
    stale = "<div class=\"stale\"><div class=\"qt\">Changed elsewhere since you started editing</div>"
      + "<div>v" + esc(base.version) + " → v" + esc(c.version) + (moved.length ? ": " + esc(moved.join(", ")) : " (activity, links or claim)") + " changed. "
      + (clash.length ? "You edited " + esc(clash.join(", ")) + " too — keeping your edits replaces the new value. " : "")
      + "Fields you did not touch already show the new values. Saving is refused until you choose.</div>"
      + "<div class=\"dactions\"><button class=\"btn primary\" id=\"d-rebase\" " + (ro?"disabled":"") + ">Keep my edits on v" + esc(c.version) + "</button>"
      + "<button class=\"btn\" id=\"d-discard\">Discard my edits</button></div></div>";
  }
  var claim = "";
  if(c.agent && c.agent.status === "working"){
    claim = "<div class=\"claim\"><span>" + esc(c.agent.name || "an agent") + " working since " + esc(fmt(c.agent.started)) + "</span>"
      + "<button class=\"btn\" id=\"d-release\" " + (ro?"disabled":"") + ">" + (confirmRelease ? "Confirm: release this claim" : "Release claim") + "</button></div>";
  }
  return "<div class=\"overlay\" id=\"ovl\"><div class=\"drawer\" data-id=\"" + esc(c.id) + "\" role=\"dialog\" aria-label=\"Card detail\">"
    + "<button class=\"closex\" id=\"d-close\" aria-label=\"Close\">×</button>"
    + "<div class=\"cid\" style=\"font:500 11px 'IBM Plex Mono',monospace;color:var(--muted)\">" + esc(c.id) + " · created " + esc(fmt(c.created)) + " · v" + esc(c.version) + (c.source ? " · review feedback on " + esc(c.source.card || "milestone " + c.source.milestone) : "") + "</div>"
    + stale + claim + wt
    + "<div class=\"mrow\"><label for=\"d-title\">Title</label><input id=\"d-title\" value=\"" + esc(c.title) + "\" " + (ro?"disabled":"") + "></div>"
    + "<div class=\"tworow\">"
    + "<div class=\"mrow\"><label for=\"d-col\">Column</label><select id=\"d-col\" " + (ro?"disabled":"") + ">" + colOpts + "</select></div>"
    + "<div class=\"mrow\"><label for=\"d-role\">Role</label><select id=\"d-role\" " + (ro?"disabled":"") + ">" + roleOpts + "</select></div>"
    + "<div class=\"mrow\"><label for=\"d-pri\">Priority</label><select id=\"d-pri\" " + (ro?"disabled":"") + ">" + priOpts + "</select></div>"
    + "</div>"
    + "<div class=\"mrow\"><label for=\"d-body\">Spec</label><textarea id=\"d-body\" " + (ro?"disabled":"") + ">" + esc(c.body) + "</textarea></div>"
    + q
    + ownPr
    + msSec
    + (links ? "<div class=\"links\"><h3>References</h3>" + links + "</div>" : "")

    + "<button class=\"btn primary\" id=\"d-save\" " + (ro?"disabled":"") + ">Save changes</button>"

    + "</div>"

}

// Live refreshes re-render the page; keep what the user is typing. Values
// are restored only into the SAME overlay they were typed in (same card's
// drawer, the new-card modal, the same card's PR dialog).
var FIELDS = {drawer: ["d-title","d-body","d-col","d-role","d-pri","d-ms","d-area","d-summary","d-ht","d-answer","d-ruling"],
              create: ["n-title","n-body","n-role","n-pri","n-ms"], pr: ["pr-url"], ms: ["nm-name"]};
function overlayKeys(){
  var dr = document.querySelector(".drawer[data-id]"), pr = document.getElementById("provl");
  return {drawer: dr ? dr.dataset.id : null, create: !!document.getElementById("n-title"), pr: pr ? pr.dataset.id : null, ms: !!document.getElementById("nm-name")};
}
function captureDraft(){
  var d = {keys: overlayKeys(), values: {}, focus: null};
  Object.keys(FIELDS).forEach(function(k){ FIELDS[k].forEach(function(f){ var el = document.getElementById(f); if(el) d.values[f] = el.value; }); });
  var ae = document.activeElement;
  if(ae && ae.id && Object.prototype.hasOwnProperty.call(d.values, ae.id)) d.focus = {id: ae.id, start: ae.selectionStart, end: ae.selectionEnd, scroll: ae.scrollTop};
  return d;
}
// `keepDrawer` lists the drawer inputs to restore: only the ones the user
// edited. Every other drawer field shows the card as it is now.
function restoreDraft(d, keepDrawer){
  var now = overlayKeys();
  var same = {drawer: d.keys.drawer && d.keys.drawer === now.drawer, create: d.keys.create && now.create, pr: d.keys.pr && d.keys.pr === now.pr, ms: d.keys.ms && now.ms};
  Object.keys(FIELDS).forEach(function(k){
    if(!same[k]) return;
    FIELDS[k].forEach(function(f){
      var el = document.getElementById(f);
      var keep = k !== "drawer" || keepDrawer.indexOf(f) >= 0;
      if(el && keep && Object.prototype.hasOwnProperty.call(d.values, f)) el.value = d.values[f];
      if(d.focus && d.focus.id === f && el){ el.focus(); try{ el.setSelectionRange(d.focus.start, d.focus.end); }catch(e){} el.scrollTop = d.focus.scroll; }
    });
  });
}

function render(){
  var keep = captureDraft();
  // The user's edits, read before anything is redrawn.
  if(discardDraft || !openCardId || keep.keys.drawer !== openCardId){ rendered = {}; renderedFor = null; }
  var edits = drawerEdits(keep.values, openCardId);
  // No edits yet: follow the card forward. With edits: hold the base until the
  // user rebases or discards (see the drawer's changed-elsewhere notice).
  if(!openCardId) base = null;
  else if(full[openCardId] && (!base || base.id !== openCardId || discardDraft || !Object.keys(edits).length)) base = snapshot(full[openCardId]);
  discardDraft = false;
  var keepDrawer = Object.keys(edits).map(function(k){ return DRAWER[k]; }).concat(["d-answer","d-ruling"]);
  var shown = state.cards.filter(inFilter);
  var archivedCards = shown.filter(function(c){ return c.column === "archived"; });
  var visCols = COLUMNS.slice();
  if(showArchived && archivedCards.length) visCols.push(ARCHIVED);
  var cols = "";
  for(var i=0;i<visCols.length;i++){
    var col = visCols[i];
    var cs = shown.filter(function(c){ return c.column === col.key; });
    var inner = cs.map(cardHtml).join("") || "<div class=\"empty\">" + (loadedOnce ? "empty" : "…") + "</div>";
    cols += "<div class=\"col\" data-col=\"" + col.key + "\">"
      + "<div class=\"colhead\"><span class=\"nm\">" + col.label + "</span><span class=\"ct\">" + cs.length + "</span><span class=\"hint\">" + col.hint + "</span></div>"
      + "<div class=\"cards\">" + inner + "</div></div>";
  }
  var msel = "<option value=\"\"" + (msFilter ? "" : " selected") + ">All cards</option>"
    + "<option value=\"" + NO_MS + "\"" + (msFilter === NO_MS ? " selected" : "") + ">No milestone</option>";
  state.milestones.forEach(function(m){
    msel += "<option value=\"" + esc(m.name) + "\"" + (msFilter === m.name ? " selected" : "") + ">Milestone " + esc(m.name) + " (" + esc(m.status.replace("_"," ")) + ")</option>";
  });
  if(msFilter && msFilter !== NO_MS && !milestone(msFilter)) msel += "<option value=\"" + esc(msFilter) + "\" selected>Milestone " + esc(msFilter) + " (unknown)</option>";
  var reviewLink = msFilter && milestone(msFilter)
    ? "<a class=\"btn\" id=\"reviewlink\" href=\"/milestones/" + encodeURIComponent(msFilter) + "\">Review " + esc(msFilter) + " →</a>" : "";
  app.innerHTML =
    "<div class=\"hdr\"><h1>ArenaSim <span class=\"ax\">Dispatch</span></h1>"
    + "<span class=\"sub\">" + shown.length + " cards · drag to In&nbsp;Progress to put an agent on it</span>"
    + "<span class=\"spacer\"></span><span class=\"stat\">" + esc(statusMsg) + "</span>"
    + "<span class=\"msbar\"><select id=\"msel\" aria-label=\"Milestone filter\">" + msel + "</select>" + reviewLink
    + "<button class=\"btn\" id=\"newms\" " + (connected?"":"disabled") + ">New milestone</button></span>"
    + (archivedCards.length ? "<button class=\"btn\" id=\"archbtn\">" + (showArchived ? "Hide archived" : "Archived (" + archivedCards.length + ")") + "</button>" : "")
    + "<button class=\"btn primary\" id=\"newbtn\" " + (connected?"":"disabled") + ">New card</button></div>"
    + (!connected && loadedOnce ? "<div class=\"robanner\">The board daemon is unreachable — changes can't be saved until it is back. Retrying…</div>" : "")
    + "<div class=\"boardwrap\"><div class=\"board\" style=\"grid-template-columns:repeat(" + visCols.length + ",minmax(216px,1fr));min-width:" + (visCols.length*224) + "px\">" + cols + "</div></div>"
    + (openCardId && card(openCardId) ? drawerHtml({id: openCardId}, edits) : "")
    + (showNew ? modalHtml() : "")
    + (showNewMs ? msModalHtml() : "")
    + (pending && card(pending.id) ? prModalHtml(card(pending.id), pending.column) : "");
  restoreDraft(keep, keepDrawer);
  // Remember what the drawer now shows in every field the user has not
  // edited; an edited field keeps the value it was edited FROM.
  if(openCardId && document.querySelector(".drawer[data-id]")){
    if(renderedFor !== openCardId){ rendered = {}; renderedFor = openCardId; }
    Object.keys(DRAWER).forEach(function(k){
      var el = document.getElementById(DRAWER[k]);
      if(el && edits[k] === undefined) rendered[DRAWER[k]] = el.value;
    });
  }
  wire();
}
function openDrawer(id){ openCardId = id; base = null; confirmDelete = false; confirmRelease = false; fetchFull(id); render(); }
function closeAll(){ if(params.get("card")){ params.delete("card"); setFilter(msFilter); } openCardId = null; showNew = false; showNewMs = false; confirmDelete = false; confirmRelease = false; pending = null; base = null; }

function wire(){
  var newbtn = document.getElementById("newbtn");
  if(newbtn) newbtn.onclick = function(){ showNew = true; render(); var t=document.getElementById("n-title"); if(t) t.focus(); };
  var msel = document.getElementById("msel");
  if(msel) msel.onchange = function(){ setFilter(msel.value); render(); };
  var newms = document.getElementById("newms");
  if(newms) newms.onclick = function(){ showNewMs = true; render(); var t=document.getElementById("nm-name"); if(t) t.focus(); };
  var nmcreate = document.getElementById("nm-create");
  if(nmcreate) nmcreate.onclick = function(){
    var n = document.getElementById("nm-name").value.trim();
    if(!n) return;
    api("POST", "/api/milestones", {name: n}).then(function(r){
      if(afterWrite(r, r.status === 200 ? "created milestone " + n : "")){ showNewMs = false; setFilter(n); }
      render();
    });
  };
  var nmcancel = document.getElementById("nm-cancel");
  if(nmcancel) nmcancel.onclick = function(){ showNewMs = false; render(); };
  var drul = document.getElementById("d-rulingbtn");
  if(drul) drul.onclick = function(){
    var c = full[openCardId], el = document.getElementById("d-ruling"); if(!c || !el) return;
    var text = el.value.trim(); if(!text) return;
    api("POST", "/api/cards/" + encodeURIComponent(c.id) + "/ruling", {text: text}).then(function(r){
      if(afterWrite(r, "ruling recorded on " + c.id)){ var e2 = document.getElementById("d-ruling"); if(e2) e2.value = ""; }
      fetchFull(c.id);
    });
  };
  var archbtn = document.getElementById("archbtn");
  if(archbtn) archbtn.onclick = function(){ showArchived = !showArchived; render(); };
  var provl = document.getElementById("provl");
  if(provl){
    provl.onclick = function(e){ if(e.target === provl){ pending = null; render(); } };
    document.getElementById("pr-cancel").onclick = function(){ pending = null; render(); };
    document.getElementById("pr-save").onclick = function(){
      var p = pending, c = p && card(p.id); if(!c){ pending = null; render(); return; }
      var u = document.getElementById("pr-url").value.trim();
      if(!PR_URL.test(u)){ statusMsg = "that is not a pull-request URL (…/pull/<n>)"; render(); return; }
      var patch = Object.assign({}, p.patch, {pr: {url: u}});
      pending = null;
      var r = moveCard(c.id, p.column, (p.why || "Dragged") + " with its PR attached via review gate", patch, p.expected, p.from);
      if(r) r.then(function(ok){ if(ok && openCardId === c.id){ openCardId = null; render(); } });
    };
    var pu = document.getElementById("pr-url"); if(pu && document.activeElement !== pu) pu.focus();
  }
  app.querySelectorAll(".wtcopy").forEach(function(b){
    b.onclick = function(e){ e.stopPropagation(); copyText(b.dataset.path); };
    b.onkeydown = function(e){ e.stopPropagation(); };
  });
  var wtc = document.getElementById("d-worktree-copy");
  if(wtc) wtc.onclick = function(){ copyText(document.getElementById("d-worktree").value); };
  app.querySelectorAll(".card").forEach(function(el){
    el.onclick = function(){ openDrawer(el.dataset.id); };
    el.onkeydown = function(e){ if(e.key==="Enter") openDrawer(el.dataset.id); };
    el.ondragstart = function(e){ e.dataTransfer.setData("text/plain", el.dataset.id); e.dataTransfer.effectAllowed = "move"; };
  });
  app.querySelectorAll(".col").forEach(function(el){
    el.ondragover = function(e){ if(!connected) return; e.preventDefault(); el.classList.add("dragover"); };
    el.ondragleave = function(){ el.classList.remove("dragover"); };
    el.ondrop = function(e){
      e.preventDefault(); el.classList.remove("dragover");
      if(!connected) return;
      var id = e.dataTransfer.getData("text/plain");
      if(id) moveCard(id, el.dataset.col, "Dragged");
    };
  });
  var ovl = document.getElementById("ovl");
  if(ovl) ovl.onclick = function(e){ if(e.target === ovl){ closeAll(); render(); } };
  var dclose = document.getElementById("d-close");
  if(dclose) dclose.onclick = function(){ closeAll(); render(); };
  var drebase = document.getElementById("d-rebase");
  if(drebase) drebase.onclick = function(){
    // Adopt the new version: from here the user's edits are measured against
    // IT, so each edited field's baseline becomes what the adopted card renders
    // into that input (setting a field back to its pre-conflict value is then
    // a real change). Rendered by drawerHtml itself, so the browser normalises
    // it exactly as a real render would.
    var c = full[openCardId], edited = drawerEdits(drawerValues(), openCardId);
    var tmp = document.createElement("div");
    tmp.innerHTML = drawerHtml({id: c.id}, {});
    Object.keys(edited).forEach(function(k){ var el = tmp.querySelector("#" + DRAWER[k]); if(el) rendered[DRAWER[k]] = el.value; });
    base = snapshot(c);
    statusMsg = "edits kept on v" + base.version + " — review and save";
    render();
  };
  var ddiscard = document.getElementById("d-discard");
  if(ddiscard) ddiscard.onclick = function(){ discardDraft = true; render(); };
  var drel = document.getElementById("d-release");
  if(drel) drel.onclick = function(){
    if(!confirmRelease){ confirmRelease = true; render(); return; }
    var c = full[openCardId]; if(!c) return;
    confirmRelease = false;
    api("POST", "/api/cards/" + encodeURIComponent(c.id) + "/release", {expected_version: c.version}).then(function(r){
      afterWrite(r, "claim released on " + c.id); fetchFull(c.id);
    });
  };
  var dsave = document.getElementById("d-save");
  if(dsave) dsave.onclick = function(){
    var c = full[openCardId]; if(!c || !base) return;
    // Only what the user changed, against the version those changes were based on.
    var e = drawerEdits(drawerValues(), openCardId);
    var patch = {}, changed = [];
    if(e.title !== undefined && e.title.trim()){ patch.title = e.title.trim(); changed.push("title"); }
    if(e.body !== undefined){ patch.body = e.body; changed.push("spec"); }
    if(e.role !== undefined){ patch.role = e.role; changed.push("role"); }
    if(e.priority !== undefined && e.priority){ patch.priority = e.priority; changed.push("priority"); }
    if(e.milestone !== undefined){ patch.milestone = e.milestone || null; changed.push("milestone"); }
    if(e.area !== undefined){ patch.area = e.area || null; changed.push("area"); }
    if(e.summary !== undefined){ patch.summary = e.summary; changed.push("summary"); }
    if(e.human_testing !== undefined){ patch.human_testing = e.human_testing; changed.push("human testing"); }
    var id = c.id, expected = base.version, req;
    if(e.column !== undefined){
      var why = changed.length ? "Edited " + changed.join(", ") + "; moved" : "Moved";
      var probe = Object.assign({}, card(id), patch.role ? {role: patch.role} : {});
      if(gated(probe, e.column)){ pending = {id: id, column: e.column, patch: patch, why: why, expected: expected, from: base.column}; render(); return; }
      req = api("POST", "/api/cards/" + encodeURIComponent(id) + "/move", Object.assign(
        {column: e.column, expected_version: expected, activity: why + ": " + base.column + " → " + e.column},
        changed.length ? {patch: patch} : {}));
    } else if(changed.length){
      req = api("POST", "/api/cards/" + encodeURIComponent(id) + "/update", {patch: patch, expected_version: expected, activity: "Edited " + changed.join(", ")});
    } else {
      // Nothing to send. With the changed-elsewhere notice up, the drawer is
      // showing a stale mix: re-render onto the current card rather than
      // closing as if something were saved.
      if(base.version !== c.version){ render(); return; }
      closeAll(); render(); return;
    }
    statusMsg = "saving…"; render();
    req.then(function(r){
      if(afterWrite(r)){ if(openCardId === id){ closeAll(); } render(); }
      else { fetchFull(id); }   // keep the drawer and the typed edits; the notice shows what changed
    });
  };
  var ddel = document.getElementById("d-delete");
  if(ddel) ddel.onclick = function(){
    if(!confirmDelete){ confirmDelete = true; render(); return; }
    var c = full[openCardId]; if(!c) return;
    api("POST", "/api/cards/" + encodeURIComponent(c.id) + "/delete", {expected_version: c.version}).then(function(r){
      if(afterWrite(r, "deleted " + c.id)){ closeAll(); } else { confirmDelete = false; fetchFull(c.id); }
      render();
    });
  };
  var dans = document.getElementById("d-answerbtn");
  if(dans) dans.onclick = function(){
    var c = full[openCardId]; if(!c || !c.question) return;
    var a = document.getElementById("d-answer").value.trim();
    if(!a) return;
    api("POST", "/api/cards/" + encodeURIComponent(c.id) + "/answer", {answer: a, expected_version: c.version}).then(function(r){
      if(afterWrite(r)){ closeAll(); } else { fetchFull(c.id); }
      render();

  };
  var ncreate = document.getElementById("n-create");
  if(ncreate) ncreate.onclick = function(){
    var t = document.getElementById("n-title").value.trim();
    if(!t) return;
    var nb = {
      title: t, body: document.getElementById("n-body").value,
      role: document.getElementById("n-role").value, priority: document.getElementById("n-pri").value
    };
    var nms = document.getElementById("n-ms").value; if(nms) nb.milestone = nms;
    api("POST", "/api/cards", nb).then(function(r){
      if(afterWrite(r, r.status === 200 ? "created " + r.body.id : "")){ showNew = false; }
      render();
    });
  };
  var ncancel = document.getElementById("n-cancel");
  if(ncancel) ncancel.onclick = function(){ showNew = false; render(); };
}

document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && (openCardId || showNew || showNewMs || pending)){ closeAll(); render(); }
});

// Live refresh: the daemon nudges this page on every board event, whoever wrote it.
var timer = null;
function scheduleLoad(){ if(timer) return; timer = setTimeout(function(){ timer = null; load(); }, 120); }
var es = new EventSource("/api/stream");
es.onopen = function(){ connected = true; if(statusMsg === "connecting…" || /unreachable/.test(statusMsg)) statusMsg = "connected"; load(); };
es.onmessage = function(){ scheduleLoad(); };
es.onerror = function(){ connected = false; statusMsg = "daemon unreachable — retrying"; render(); };
// A link to one card (the review page's card ids): open its drawer.
if(params.get("card")) openDrawer(params.get("card"));
render();
load();
})();
</script></body></html>
