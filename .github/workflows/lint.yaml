# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint

# Split out of ci.yaml rather than bolted onto it. `ci.yaml` builds release AND
# tests dev, compiling the Bevy graph twice for 16-18 minutes cached; clippy
# needs neither codegen nor a test binary, so a formatting slip or a lint
# regression gets its own answer in a fraction of that instead of waiting
# behind the suite.
#
# Same trigger shape as ci.yaml, and for the same reason: on `main` after each
# merge, never on pull_request. Per-PR CI was declined on cost, and a job being
# cheap is not a reason to reopen that. A contributor who wants the verdict on
# a branch first starts one by hand:
# `gh workflow run lint.yaml --ref <branch>`.
#
# `paths-ignore` mirrors ci.yaml exactly — docs and agent-harness config that
# no cargo step reads. GitHub evaluates the filter only on push, never on a
# dispatch.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    # macos-latest to match ci.yaml's runner, so both jobs restore the same
    # Swatinem cache rather than each paying for its own.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # THE TOOLCHAIN COMES FROM `rust-toolchain.toml`, NOT FROM THIS FILE.
      #
      # This step deliberately names no version. `rust-toolchain.toml` at the
      # repo root is the single source of truth, and a bare
      # `rustup toolchain install` provisions exactly what that file specifies
      # — channel, `profile`, and the `rustfmt` / `clippy` components. Naming a
      # version here as well would let the two drift, which is the same class
      # of defect this pin exists to close.
      #
      # It replaced `dtolnay/rust-toolchain@stable`. That action floats: it
      # resolves `stable` on the day the job runs and installs it with
      # `rustup default`. Because rustup ranks a toolchain file ABOVE the
      # default, adding `rust-toolchain.toml` would have silently reduced that
      # action to an unused download — the workflow would say "stable" while
      # the build ran the pinned version. Better to have one mechanism than a
      # decorative second one.
      #
      # `--no-self-update` keeps the step from upgrading the runner's rustup
      # mid-job; the job needs a pinned rustc, not the newest rustup.
      - name: Install the pinned toolchain
        run: rustup toolchain install --no-self-update

      # After the install, so the cache key is computed from the PINNED rustc
      # rather than whatever the runner image shipped with.
      - uses: Swatinem/rust-cache@v2

      # Printed so a future failure can be attributed without re-deriving it.
      # The gap this closes was worth about 10 red runs: CI floated to 1.98.1
      # while every developer was on 1.96.0, so the same tree was clean locally
      # and failed here, and the log was the only place the difference showed.
      - name: Toolchain versions
        run: |
          rustc --version
          cargo clippy --version
          rustup show active-toolchain

      # No --locked: this step reads no lockfile-sensitive output, and ci.yaml
      # already fails on a stale Cargo.lock.
      - name: Format
        run: cargo fmt --check

      # Default target set (lib + bins), which is what the repo's shipping code
      # is. The tree is also clean under `--all-targets`, but adding it here
      # would compile every integration-test target and is the slow half of the
      # job it exists to avoid.
      - name: Clippy
        run: cargo clippy -- -D warnings

# ---------------------------------------------------------------------------
# IF THIS JOB GOES RED RIGHT AFTER A TOOLCHAIN BUMP, SUSPECT THE BUMP.
#
# Worth stating because this job spent its entire first life red for exactly
# that reason, and the redness was not the merges it landed on. Every run from
# the job's introduction onward failed identically — 89 `float_literal_f32_fallback`
# plus one `clippy::question_mark`, in files the merged cards had never
# touched — because CI installed whatever `stable` meant that day (1.98.1)
# while the whole team ran 1.96.0. Both lints widened in between. Every
# engineer who reported clippy clean was telling the truth about their own
# machine.
#
# The cost of that is not the lint sites; it is that an always-red gate reports
# nothing. A real regression would have arrived as the eleventh identical
# failure and been indistinguishable from the ten before it. So: when the
# version in `rust-toolchain.toml` changes, read the first red run as a
# question about the toolchain before reading it as a question about the diff,
# and get the gate back to green quickly rather than letting a standing failure
# become the background.
# ---------------------------------------------------------------------------
